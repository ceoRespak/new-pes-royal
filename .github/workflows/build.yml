name: Build respakexpress

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build the website
        run: npm run build

      - name: Prepare upload folder
        run: |
          rm -rf upload
          mkdir -p upload
          cp -r .next upload/next
          cp -r public upload/public
          du -sh upload
          ls -la upload

      - name: Upload finished build
        uses: actions/upload-artifact@v4
        with:
          name: respakexpress-build
          path: upload
          if-no-files-found: error
